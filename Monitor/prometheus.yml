global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'backend-1'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000']

  - job_name: 'backend-2'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5001']

